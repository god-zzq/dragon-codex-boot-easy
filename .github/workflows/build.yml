name: Windows build and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test
        shell: powershell
        run: ./scripts/test.ps1
      - name: Package with video
        shell: powershell
        run: ./scripts/package.ps1
      - name: Verify clean repository and package
        shell: powershell
        run: ./scripts/verify-repository.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: DragonCodexBootEasy-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: DragonCodexBootEasy-windows-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Codex 龙娘启动 · 简易版 $GITHUB_REF_NAME" --generate-notes --draft
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

